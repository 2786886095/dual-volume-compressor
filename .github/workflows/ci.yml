name: CI

on:
  push:
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug --target-platform android-arm64

  windows-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell sources
        shell: powershell
        run: |
          $errors = @()
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            $errors += $parseErrors
          }
          if ($errors.Count) { $errors | Format-List; exit 1 }
      - name: Verify profile presets switch immediately
        shell: powershell
        run: |
          $source = [IO.File]::ReadAllText((Resolve-Path '.\DualVolumeCompressor.ps1'))
          if ($source.Contains('$applyProfileButton')) {
            throw 'The separate profile apply button is still present.'
          }
          $handler = [regex]::Match(
            $source,
            '(?s)\$profileBox\.Add_SelectedIndexChanged\(\{.*?Apply-CompressionProfile\s+-Profile\s+\$script:CompressionProfiles\[\$index\].*?\}\)'
          )
          if (-not $handler.Success) {
            throw 'The profile selector does not switch profiles immediately.'
          }
